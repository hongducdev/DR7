<html><head>

    <meta http-equiv="content-type" content="text/html" charset="UTF-8">
    <title>MHK DR7</title>

	<link id="ppstyle" rel="stylesheet" type="text/css" href="./style.css">
    <link rel="stylesheet" href="css/layout.css" type="text/css">
    <script type="text/javascript" src="./js/CSInterface.js"></script>

    <!-- Bảng màu nút: layout.css là bản chính, khối này chỉ để dự phòng. -->
<style>
	.ba1, .ba2, .ba7, .ba8, .ba9, .ba11 {
		border-radius: 25px;
		text-align: center;
		height: 25px;
		font-family: "Segoe UI", "Microsoft YaHei", Tahoma, sans-serif;
		color: aliceblue;
		font-size: 12px;
	}
	.ba1 { border: 1px solid #29c95e; background: #29c95e; }
	.ba2 { background: #01aef6; }
	.ba7 { border: 1px solid #ff3e58; background: #ff3e58; }
	.ba8 { border: 1px solid #01aef6; background: #01aef6; }
	.ba9 { background: #ffc23e; }
	.ba11 { border: 1px solid #ffc23e; background: #ffc23e; width: 222px; }
	.ba1:hover, .ba2:hover, .ba7:hover, .ba8:hover, .ba9:hover, .ba11:hover {
		background: #ffffff;
		color: #333333;
	}
</style>
    <!-- JavaScript của panel -->


</head>
<body onload="onLoaded();onClickButton('BUGFIX')">
<button class="reload-panel" onclick="dr7Reload()" title="Nạp lại code plugin (không cần tắt Photoshop)" aria-label="Nạp lại plugin">↻</button>
<div class="panel">
	<div class="action-grid">
		<button class="ba11" onclick="onClickButton('DS')" title="Làm da tự động">Làm Da V5.0</button>

		<button class="ba1" onclick="onClickButton('BA')" title="Thiết lập thông số để lưu và sử dụng">Hàng loạt</button>
		<button class="ba8" onclick="onClickButton('SE')" title="Tự động">Tự động</button>
		<button class="ba1" onclick="onClickButton('WM')" title="Thêm chữ/LOGO hàng loạt">Chữ / Logo</button>

		<button class="ba1" onclick="onClickButton('LS')" title="Làm mịn da">Làm mịn</button>
		<button class="ba1" onclick="onClickButton('SS')" title="Lẫn mịn">Lẫn mịn</button>
		<button class="ba1" onclick="onClickButton('RE')" title="Tẩy lông">Tẩy lông</button>

		<button class="ba1" onclick="onClickButton('DB')" title="Đánh khối">Đánh Khối</button>
		<button class="ba7" onclick="onClickButton('SH')" title="Làm nét">Làm nét</button>
		<button class="ba7" onclick="onClickButton('LI')" title="Liquify">Liquify</button>

		<button class="ba7" onclick="doa('GGXS')" title="Làm sáng vùng highlight">Highlight</button>
		<button class="ba7" onclick="doa('TJSH')" title="Phủ phấn">Phủ phấn</button>
		<button class="ba7" onclick="doa('JMXS')" title="Lông mi">Lông Mi</button>

		<button class="ba7" onclick="doa('TJYY')" title="Bóng mắt">Bóng Mắt</button>
		<button class="ba9" onclick="onClickButton('BTNPFSD2')" title="Màu da chung">Màu tổng</button>
		<button class="ba9" onclick="onClickButton('TC')" title="Màu da">Màu Da</button>

		<button class="ba9" onclick="doa('FSJH')" title="Giảm vàng">Giảm Vàng</button>
		<button class="ba9" onclick="doa('MBPF')" title="Trắng da">Trắng Da</button>
		<button class="ba1" onclick="onClickButton('WT')" title="Trắng răng">Trắng Răng</button>

		<button class="ba1" onclick="doa('ZCZQ')" title="Son môi">Son Môi</button>
		<button class="ba1" onclick="doa('CGYSB')" title="Lớp hào quang Screen">Hào Quang</button>
		<button class="ba1" onclick="doa('MLXG')" title="Hoa văn hạt phim">Hạt phim</button>

		<button class="ba2" onclick="doa('DKACR')" title="Camera Raw">Camera Raw</button>
		<button class="ba2" onclick="onClickButton('PP_DETAIL')" title="High Pass trên lớp riêng">Chi tiết</button>
		<button class="ba1" onclick="doa('mcwl')" title="Hoa văn hạt thô">Hạt thô</button>

		<button class="ba1" onclick="doa('sfb')" title="Hoa văn chấm">Chấm</button>
	</div>
</div>
<script type="text/javascript" src="./js/panel.js"></script>


</body></html>
